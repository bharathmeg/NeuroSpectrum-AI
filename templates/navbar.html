<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --navbar-bg: #ffffff;
        --navbar-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        --primary-color: #2563eb;
        --secondary-color: #1e40af;
        --text-dark: #1e293b;
        --text-light: #64748b;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .custom-navbar {
        background: var(--navbar-bg) !important;
        box-shadow: var(--navbar-shadow);
        padding: 1rem 0;
        transition: all 0.3s ease;
        position: sticky;
        top: 0;
        z-index: 1050;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .custom-navbar.scrolled {
        padding: 0.5rem 0;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
    }

    .navbar-brand {
        font-family: 'Poppins', sans-serif !important;
        font-weight: 700 !important;
        font-size: 1.5rem !important;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none !important;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .navbar-brand:hover {
        transform: scale(1.05);
    }

    .brand-icon {
        width: 40px;
        height: 40px;
        background: var(--gradient-primary);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.2rem;
    }

    .navbar-nav .nav-link {
        font-family: 'Inter', sans-serif !important;
        font-weight: 500 !important;
        color: var(--text-dark) !important;
        padding: 0.75rem 1.25rem !important;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none !important;
    }

    .navbar-nav .nav-link:hover {
        color: var(--primary-color) !important;
        background-color: rgba(37, 99, 235, 0.1);
        transform: translateY(-2px);
    }

    .navbar-nav .nav-link.active {
        color: var(--primary-color) !important;
        background-color: rgba(37, 99, 235, 0.1);
    }

    .navbar-nav .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--gradient-primary);
        transition: all 0.3s ease;
        transform: translateX(-50%);
    }

    .navbar-nav .nav-link:hover::after,
    .navbar-nav .nav-link.active::after {
        width: 80%;
    }

    .nav-cta {
        background: var(--gradient-primary) !important;
        color: white !important;
        border-radius: 25px !important;
        padding: 0.6rem 1.5rem !important;
        font-weight: 600 !important;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        border: none;
    }

    .nav-cta:hover {
        color: white !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .nav-logout {
        color: var(--danger-color) !important;
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 20px !important;
    }

    .nav-logout:hover {
        background-color: rgba(239, 68, 68, 0.1) !important;
        color: var(--danger-color) !important;
    }

    .navbar-toggler {
        border: none !important;
        padding: 0.5rem;
        border-radius: 8px;
        transition: all 0.3s ease;
    }

    .navbar-toggler:focus {
        box-shadow: none !important;
    }

    .navbar-toggler-icon {
        background-image: none;
        width: 24px;
        height: 18px;
        position: relative;
        transform: rotate(0deg);
        transition: 0.3s ease-in-out;
    }

    .navbar-toggler-icon::before,
    .navbar-toggler-icon::after,
    .navbar-toggler-icon {
        background: var(--text-dark);
    }

    .navbar-toggler-icon::before,
    .navbar-toggler-icon::after {
        content: "";
        position: absolute;
        left: 0;
        width: 24px;
        height: 2px;
        background: var(--text-dark);
        border-radius: 2px;
        transition: 0.3s ease-in-out;
    }

    .navbar-toggler-icon::before {
        top: -8px;
    }

    .navbar-toggler-icon::after {
        bottom: -8px;
    }

    .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon {
        background: transparent;
    }

    .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon::before {
        top: 0;
        transform: rotate(45deg);
    }

    .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon::after {
        bottom: 0;
        transform: rotate(-45deg);
    }

    @media (max-width: 991.98px) {
        .navbar-collapse {
            background: white;
            margin-top: 1rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 1rem;
        }

        .navbar-nav .nav-link {
            margin: 0.2rem 0;
        }
    }

    /* Status indicator for logged in users */
    .user-status {
        position: relative;
    }

    .user-status::before {
        content: '';
        position: absolute;
        top: -5px;
        right: -5px;
        width: 8px;
        height: 8px;
        background: var(--success-color);
        border-radius: 50%;
        border: 2px solid white;
    }
</style>

<nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
        <a class="navbar-brand" href="/">
            <div class="brand-icon">
                <i class="fas fa-brain"></i>
            </div>
            NeuroSpectrum-AI
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fas fa-home"></i>
                        Home
                    </a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="/#about">
                        <i class="fas fa-info-circle"></i>
                        About
                    </a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="/model">
                        <i class="fas fa-robot"></i>
                        AI Models
                    </a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="/result">
                        <i class="fas fa-chart-line"></i>
                        Results
                    </a>
                </li>
                
                {% if session.get('logged') %}
                    <li class="nav-item">
                        <a class="nav-link nav-cta user-status" href="/predict">
                            <i class="fas fa-stethoscope"></i>
                            Start Assessment
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link nav-logout" href="/logout">
                            <i class="fas fa-sign-out-alt"></i>
                            Logout
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link nav-cta" href="/login">
                            <i class="fas fa-user-circle"></i>
                            Get Started
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Add scrolled class to navbar when scrolling
    window.addEventListener('scroll', function() {
        const navbar = document.querySelector('.custom-navbar');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Add active class to current page nav link
    document.addEventListener('DOMContentLoaded', function() {
        const currentLocation = location.pathname;
        const menuItems = document.querySelectorAll('.nav-link');
        
        menuItems.forEach(item => {
            if (item.getAttribute('href') === currentLocation) {
                item.classList.add('active');
            }
        });
    });

    // Close mobile menu when clicking a link
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
            const navbarCollapse = document.querySelector('.navbar-collapse');
            if (navbarCollapse.classList.contains('show')) {
                const bsCollapse = new bootstrap.Collapse(navbarCollapse);
                bsCollapse.hide();
            }
        });
    });
</script>
